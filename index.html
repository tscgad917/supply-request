  <div>
    <h1>傳票耗材申請</h1>
    <p>115 年各分社</p>
  </div>
  <span class="grow"></span>
  <a class="linkbtn" href="admin.html">後台</a>
</header>

<div class="wrap">

  <div id="setupNotice" class="notice" hidden>
    還沒接上資料庫。請打開 <code>config.js</code>，把 Supabase 的網址和 anon key 貼進去。
  </div>

  <section class="card">
    <div class="body">
      <h2 class="sec">填單資料</h2>
      <p class="sub">選好單位就會顯示這次的收單期限。</p>

      <div class="grid2">
        <div class="field">
          <label class="f" for="unit">填單單位 <span class="req">*</span></label>
          <select id="unit" required>
            <option value="">請選擇分社</option>
          </select>
        </div>
        <div class="field">
          <label class="f" for="applicant">填單人 <span class="req">*</span></label>
          <input type="text" id="applicant" placeholder="請輸入姓名" autocomplete="name" required>
        </div>
      </div>

      <div class="field" id="batchPickWrap" hidden>
        <label class="f" for="batch">收單批次</label>
        <select id="batch"></select>
      </div>

<div class="field">
  <label class="f" for="applyDate">填單日期</label>
  <input type="text" id="applyDate" readonly>
</div>
    </div>

    <div id="batchBar" class="batchbar" hidden></div>
  </section>

  <section class="card" id="itemCard">
    <div class="body" style="padding-bottom:4px">
      <h2 class="sec">申請項目</h2>
      <p class="sub">點分類展開，只要填需要的數量，其餘留空即可。</p>
    </div>
    <div id="groups"></div>
  </section>

  <section class="card">
    <div class="body">
      <h2 class="sec">其他項目與備註</h2>
      <p class="sub">上面沒有列出的品項寫在這裡（請註明項目與數量）。未列出項目請先來電總務課確認是否提供。</p>
      <textarea id="note" placeholder="例：放款封面 1 本"></textarea>
    </div>
  </section>

  <div style="margin-top:16px;text-align:right">
    <button type="button" class="ghost small" id="clearBtn">清空所有數量</button>
  </div>
</div>

<div class="dock">
  <div class="inner">
    <div class="count">已填 <b id="totalCount">0</b> 項<span id="savedAt" class="saved"></span></div>
    <button type="button" id="submitBtn">儲存申請</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="items.js"></script>
<script>
(function () {
  "use strict";

  function $(id) { return document.getElementById(id); }

  function looksSet(v) {
    return typeof v === "string" && v.trim() !== "" && v.indexOf("請貼上") === -1;
  }
  function peek(v) {
    if (typeof v !== "string" || !v.trim()) return "（空白）";
    if (v.indexOf("請貼上") > -1) return "（還是原本的預設文字）";
    return v.length > 40 ? v.slice(0, 30) + "…" + v.slice(-6) : v;
  }
  var urlOK = looksSet(SUPABASE_URL) && /^https?:\/\//.test(SUPABASE_URL);
  var keyOK = looksSet(SUPABASE_ANON_KEY);
  var configured = urlOK && keyOK;

  function showSetupNotice(el) {
    el.hidden = false;
    el.innerHTML =
      "<b>還沒接上資料庫。</b>瀏覽器現在讀到的 <code>config.js</code> 內容是：" +
      "<div style=\"margin-top:8px;line-height:1.9\">" +
      "網址：<code>" + peek(SUPABASE_URL) + "</code> " + (urlOK ? "✓" : "✗ 要用 https:// 開頭的完整網址") +
      "<br>金鑰：<code>" + peek(SUPABASE_ANON_KEY) + "</code> " + (keyOK ? "✓" : "✗") +
      "</div>" +
      "<div style=\"margin-top:8px\">如果上面顯示的就是你貼好的值，那是瀏覽器抓到舊檔：" +
      "電腦按 Ctrl+Shift+R（Mac 是 Cmd+Shift+R）強制重整，手機把桌面圖示刪掉重加。</div>";
  }

  var db = null;
  if (configured) {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } else {
    showSetupNotice($("setupNotice"));
  }

  var batches = [];      // 這個單位可以填的批次
  var currentBatch = null;
  var existingId = null; // 已經有單子的話存 id

  /* ---------- 小工具 ---------- */
  var toastTimer;
  function toast(msg, bad) {
    var t = $("toast");
    t.textContent = msg;
    t.className = "toast show" + (bad ? " bad" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = "toast"; }, 2800);
  }
  function store(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(k);
      localStorage.setItem(k, v);
    } catch (e) {}
    return null;
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayISO() { return iso(new Date()); }
  function daysLeft(deadline) {
    var a = new Date(todayISO() + "T00:00:00");
    var b = new Date(deadline + "T00:00:00");
    return Math.round((b - a) / 86400000);
  }
  function rocDate(dateStr) {
    return (parseInt(dateStr.slice(0, 4), 10) - 1911) + "/" +
           dateStr.slice(5, 7) + "/" + dateStr.slice(8, 10);
  }

  /* ---------- 單位下拉 ---------- */
  var unitSel = $("unit");
  UNITS.forEach(function (u) {
    var o = document.createElement("option");
    o.value = u; o.textContent = u;
    unitSel.appendChild(o);
  });

$("applyDate").value = rocDate(todayISO());

  /* ---------- 建立摺疊選單 ---------- */
  var groupsEl = $("groups");

  CATEGORIES.forEach(function (cat) {
    var d = document.createElement("details");
    d.className = "group";

    var s = document.createElement("summary");
    s.innerHTML =
      '<span class="chev"></span>' +
      '<span><span class="gname">' + cat.name + "</span> " +
      '<span class="ghint">' + cat.hint + "</span></span>" +
      '<span class="gcount zero">0</span>';
    d.appendChild(s);

    var box = document.createElement("div");
    box.className = "rows";

    cat.items.forEach(function (it) {
      var row = document.createElement("div");
      row.className = "row";

      var nm = document.createElement("div");
      nm.className = "nm";
      nm.textContent = it.n;

var qty = document.createElement("select");
qty.className = "qty";

var maxQty = Number(it.max || 10);

for (var i = 0; i <= maxQty; i++) {
  var opt = document.createElement("option");
  opt.value = i;
  opt.textContent = i;
  qty.appendChild(opt);
}

qty.value = "0";
qty.dataset.name = it.n;
qty.dataset.unit = it.u;
qty.setAttribute("aria-label", it.n + " 數量");

      var un = document.createElement("span");
      un.className = "unit";
      un.textContent = it.u;

      qty.addEventListener("change", function () {
        row.classList.toggle("on", Number(qty.value) > 0);
        refreshCounts();
      });

      row.appendChild(nm);
      row.appendChild(qty);
      row.appendChild(un);
      box.appendChild(row);
    });

    d.appendChild(box);
    groupsEl.appendChild(d);
  });

  /* ---------- 統計 ---------- */
  function collect() {
    var out = [];
    document.querySelectorAll(".qty").forEach(function (q) {
      var v = Number(q.value);
      if (v > 0) out.push({ name: q.dataset.name, qty: v, unit: q.dataset.unit });
    });
    return out;
  }

  function refreshCounts() {
    var total = 0;
    document.querySelectorAll("details.group").forEach(function (d) {
      var n = 0;
      d.querySelectorAll(".qty").forEach(function (q) { if (Number(q.value) > 0) n++; });
      var badge = d.querySelector(".gcount");
      badge.textContent = n;
      badge.className = "gcount" + (n ? "" : " zero");
      total += n;
    });
    $("totalCount").textContent = total;
    return total;
  }

  function clearQty() {
    document.querySelectorAll(".qty").forEach(function (q) {
      q.value = "";
      q.parentNode.classList.remove("on");
    });
    $("note").value = "";
    refreshCounts();
  }

  function setLocked(locked) {
    document.querySelectorAll(".qty").forEach(function (q) { q.disabled = locked; });
    $("note").disabled = locked;
    $("clearBtn").disabled = locked;
    $("submitBtn").disabled = locked;
  }

  /* ---------- 批次 ---------- */
  async function loadBatches() {
    if (!configured) return;
    var res = await db.from("supply_batches").select("*").order("deadline", { ascending: true });
    if (res.error) { toast("讀取批次失敗：" + res.error.message, true); return; }
    window.__allBatches = res.data || [];
  }

  function batchesFor(unit) {
    var today = todayISO();
    return (window.__allBatches || []).filter(function (b) {
      return (b.units || []).indexOf(unit) > -1 && b.deadline >= today;
    });
  }

  function batchLabel(b) {
    return b.code + "　" + (b.route || "") + "　截止 " + rocDate(b.deadline);
  }

  async function onUnitChange() {
    var unit = unitSel.value;
    existingId = null;
    $("savedAt").textContent = "";
    clearQty();

    if (!unit) {
      $("batchBar").hidden = true;
      $("batchPickWrap").hidden = true;
      currentBatch = null;
      return;
    }
    store("supply-unit", unit);

    batches = batchesFor(unit);

    if (!batches.length) {
      currentBatch = null;
      $("batchPickWrap").hidden = true;
      $("batchBar").hidden = false;
      $("batchBar").className = "batchbar closed";
      $("batchBar").innerHTML = "<b>目前沒有正在收單的批次</b><span>總務課還沒開下一次收單，請稍後再進來，或直接來電詢問。</span>";
      setLocked(true);
      return;
    }

    var pick = $("batchPickWrap");
    var sel = $("batch");
    if (batches.length > 1) {
      sel.innerHTML = "";
      batches.forEach(function (b, i) {
        var o = document.createElement("option");
        o.value = i; o.textContent = batchLabel(b);
        sel.appendChild(o);
      });
      pick.hidden = false;
    } else {
      pick.hidden = true;
    }

    await useBatch(batches[0]);
  }

  async function useBatch(b) {
    currentBatch = b;
    var left = daysLeft(b.deadline);
    var leftText = left === 0 ? "今天就是最後一天" : "還有 " + left + " 天";
    $("batchBar").hidden = false;
    $("batchBar").className = "batchbar" + (left <= 1 ? " urgent" : "");
    $("batchBar").innerHTML =
      "<b>" + b.code + " 收單中" + (b.route ? "（" + b.route + "）" : "") + "</b>" +
      "<span>截止 " + rocDate(b.deadline) + "　" + leftText + "，這之前都可以回來繼續填或修改。</span>";
    setLocked(false);
    await loadExisting();
  }

  $("batch").addEventListener("change", function () {
    clearQty();
    useBatch(batches[Number(this.value)]);
  });

  /* ---------- 讀回已經填過的內容 ---------- */
  async function loadExisting() {
    existingId = null;
    $("savedAt").textContent = "";
    $("submitBtn").textContent = "儲存申請";
    if (!configured || !currentBatch || !unitSel.value) return;

    var res = await db.from("supply_requests").select("*")
      .eq("batch_code", currentBatch.code)
      .eq("unit_code", unitSel.value)
      .maybeSingle();

    if (res.error || !res.data) return;
    var r = res.data;
    existingId = r.id;

    (r.items || []).forEach(function (it) {
      document.querySelectorAll(".qty").forEach(function (q) {
        if (q.dataset.name === it.name) {
          q.value = it.qty;
          q.parentNode.classList.add("on");
          q.closest("details").open = true;
        }
      });
    });
    $("note").value = r.note || "";
    if (r.applicant && !$("applicant").value) $("applicant").value = r.applicant;

    refreshCounts();
    $("submitBtn").textContent = "更新申請";
    var t = new Date(r.updated_at || r.created_at);
    $("savedAt").textContent = "　上次由 " + r.applicant + " 存於 " +
      pad(t.getMonth() + 1) + "/" + pad(t.getDate()) + " " + pad(t.getHours()) + ":" + pad(t.getMinutes());
  }

  unitSel.addEventListener("change", onUnitChange);
  $("applicant").addEventListener("change", function () { store("supply-name", this.value.trim()); });

  /* ---------- 清空 ---------- */
  $("clearBtn").addEventListener("click", function () {
    if (!confirm("會把這張單的數量全部清掉（要按儲存才會真的送出去），確定嗎？")) return;
    clearQty();
    toast("數量已清空，記得按儲存");
  });

  /* ---------- 儲存 ---------- */
  $("submitBtn").addEventListener("click", async function () {
    var btn = this;

    if (!configured) { toast("尚未設定 Supabase，無法儲存", true); return; }
    if (!unitSel.value) { toast("請選擇填單單位", true); unitSel.focus(); return; }
    if (!$("applicant").value.trim()) { toast("請填寫填單人", true); $("applicant").focus(); return; }
    if (!currentBatch) { toast("目前沒有可以填的批次", true); return; }
    if (currentBatch.deadline < todayISO()) { toast("這個批次已經截止了", true); return; }

    var items = collect();
    var note = $("note").value.trim();
    if (!items.length && !note) { toast("還沒填任何項目", true); return; }

    var label = btn.textContent;
    btn.disabled = true;
    btn.textContent = "儲存中…";

    var payload = {
      batch_code: currentBatch.code,
      unit_code: unitSel.value,
      applicant: $("applicant").value.trim(),
      apply_date: $("applyDate").value || todayISO(),
      items: items,
      item_count: items.length,
      note: note,
      updated_at: new Date().toISOString(),
    };
    if (existingId) payload.id = existingId;

    var res = await db.from("supply_requests")
      .upsert(payload, { onConflict: "batch_code,unit_code" });

    btn.disabled = false;

    if (res.error) {
      btn.textContent = label;
      toast("儲存失敗：" + res.error.message, true);
      return;
    }

    store("supply-name", payload.applicant);
    toast(existingId ? "已更新，內容留著隨時可以再改" : "已儲存，截止前都可以回來修改");
    await loadExisting();
  });

  /* ---------- 啟動 ---------- */
  (async function init() {
    var name = store("supply-name");
    if (name) $("applicant").value = name;

    await loadBatches();

    var last = store("supply-unit");
    if (last && UNITS.indexOf(last) > -1) {
      unitSel.value = last;
      await onUnitChange();
    }
    refreshCounts();
  })();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
